name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ClawHub CLI
        run: npm install -g clawhub

      - name: Install Verified Agent Identity Package
        run: clawhub install verified-agent-identity

      - name: Install Script Dependencies
        working-directory: scripts
        run: npm install

      - name: Create Ethereum Identity
        working-directory: scripts
        run: node createNewEthereumIdentity.js

      - name: Link Human to Agent
        working-directory: scripts
        run: |
          node manualLinkHumanToAgent.js \
          --challenge '{
            "name": "SynapseID",
            "description": "SynapseID is an autonomous identity intelligence agent that connects human authenticity with machine cognition. It establishes verifiable trust signals, strengthens reputation graphs, and enables secure onboarding of agents within decentralized ecosystems."
          }'

      - name: Debug Files (Optional but Recommended)
        run: ls -R
